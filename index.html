<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gin Defense of the Gate</title>
<style>
  :root{
    --bg: #120b08;
    --panel: #201409;
    --panel-2: #150e09;
    --line: #6b4a24;
    --line-dim: #3a2814;
    --text: #f1e2c2;
    --text-dim: #b49a72;
    --accent: #e3b84f;
    --accent-dim: #8a6b23;
    --astral: #a678e0;
    --astral-dim: #6b4a94;
    --warn: #e0a458;
    --danger: #b0342a;
    --gold: #f0c85a;
    --leaf: #6b9c4a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #3a2410 0%, transparent 55%),
      radial-gradient(ellipse at 15% 110%, #2a1608 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Cambria", serif;
    overflow: hidden;
  }
  #app{ height:100vh; display:flex; align-items:center; justify-content:center; padding: 24px; }
  .rig{
    width: min(980px, 96vw);
    max-height: 94vh;
    overflow-y: auto;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 0 0 1px #000, 0 30px 90px -20px rgba(0,0,0,0.85), inset 0 0 80px rgba(227,184,79,0.03);
    padding: 30px 36px 32px;
    position: relative;
  }
  .rig::before{
    content:""; position:absolute; inset:0; border-radius:6px; pointer-events:none;
    background: repeating-linear-gradient(0deg, rgba(255,220,160,0.008) 0px, rgba(255,220,160,0.008) 1px, transparent 1px, transparent 3px);
  }
  .rig::after{ content:""; position:absolute; inset:6px; border-radius:4px; pointer-events:none; border: 1px solid var(--line-dim); }
  .corner{ position:absolute; width:16px; height:16px; color:var(--accent-dim); font-size:16px; line-height:1; opacity:0.8; pointer-events:none; }
  .corner.tl{ top:6px; left:6px; } .corner.tr{ top:6px; right:6px; }
  .corner.bl{ bottom:6px; left:6px; } .corner.br{ bottom:6px; right:6px; }

  header{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom: 1px solid var(--line-dim); padding-bottom: 14px; margin-bottom: 18px; }
  .brand h1{ margin:0; font-size: 22px; letter-spacing: 2px; color: var(--accent); text-shadow: 0 0 20px rgba(227,184,79,0.35); font-variant: small-caps; }
  .brand p{ margin: 4px 0 0; font-size: 10px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; font-style: italic;}
  .status{ text-align:right; font-size: 10px; color: var(--text-dim); letter-spacing:1px; line-height:1.7; text-transform:uppercase;}
  .status .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--astral); margin-right:6px; box-shadow:0 0 8px var(--astral); }

  .stage{ min-height: 360px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; position:relative;}

  footer.hint{ text-align:center; font-size:10px; color:#5a4426; letter-spacing:1px; margin-top:18px; font-style:italic; }

  button{
    font-family: inherit; cursor:pointer; letter-spacing:2px; text-transform:uppercase;
    font-size:13px; padding:13px 26px; border-radius:4px; border:1px solid var(--accent-dim);
    background: linear-gradient(180deg, #2c1c0c, #180f06); color: var(--accent); transition: all 0.15s; font-variant: small-caps;
  }
  button:hover{ background: linear-gradient(180deg, #3a2610, #201408); box-shadow:0 0 18px rgba(227,184,79,0.25); }
  button:active{ transform: translateY(1px); }
  button:disabled{ opacity:0.3; cursor:default; box-shadow:none; }
  button.secondary{ border-color:#4a3620; color: var(--text-dim); background: transparent;}
  button.gold{ border-color: var(--astral); color: var(--astral); }
  button.gold:hover{ box-shadow:0 0 18px rgba(166,120,224,0.35); }
  .actions{ display:flex; gap:12px; margin-top:8px; justify-content:center; flex-wrap:wrap;}

  /* ---- story slides ---- */
  .scene-story{ max-width: 660px; margin:0 auto; text-align:center; }
  .scene-story h2{ font-size:24px; letter-spacing:1px; color:var(--gold); margin: 4px 0 14px; font-variant:small-caps; }
  .story-body{ font-size:15px; line-height:1.75; color:var(--text); margin: 10px 0 6px; }
  .story-eyebrow{ font-size:11px; letter-spacing:3px; color:var(--astral); text-transform:uppercase; margin-bottom:2px;}
  .portrait-row{ display:flex; gap:26px; justify-content:center; margin:16px 0; flex-wrap:wrap; }
  .portrait{ width:140px; }
  .portrait img{ width:100%; height:180px; object-fit:cover; border-radius:6px; border:2px solid var(--line); box-shadow:0 10px 28px rgba(0,0,0,0.65); }
  .portrait .pname{ font-size:13px; color:var(--accent); text-align:center; margin-top:8px; font-variant:small-caps; letter-spacing:1px;}
  .portrait .ptitle{ font-size:10px; color:var(--text-dim); text-align:center; margin-top:2px; letter-spacing:1px; text-transform:uppercase;}
  .trial-list{ text-align:left; max-width:480px; margin:18px auto; font-size:14px; line-height:2.1; color:var(--text); list-style:none; padding:0;}
  .trial-list li b{ color:var(--accent); }

  /* ---- roster / finalists ---- */
  .roster{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:18px 0; }
  .roster-card{ border:1px solid var(--line-dim); border-radius:6px; padding:16px 18px; min-width:150px; text-align:center; cursor:pointer; background:#180f08; transition:all .15s;}
  .roster-card:hover{ border-color: var(--accent-dim); }
  .roster-card.selected{ border-color:var(--accent); box-shadow:0 0 16px rgba(227,184,79,0.3); background:#241708;}
  .roster-card input{ background:transparent; border:none; border-bottom:1px dashed var(--line-dim); color:var(--text); font-family:inherit; text-align:center; font-size:13px; width:100%; outline:none; padding-bottom:4px;}
  .roster-card .tag{ font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-top:8px;}

  /* ---- bottles ---- */
  .bottle-row{ display:flex; gap:50px; justify-content:center; margin:14px 0; flex-wrap:wrap; align-items:flex-end;}
  .bottle{ width:140px; text-align:center; position:relative;}
  .bottle-glass{ width:76px; height:150px; margin:0 auto; position:relative; border-radius:10px 10px 22px 22px; border:2px solid rgba(255,255,255,0.15); overflow:hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 12px 24px rgba(0,0,0,0.6);}
  .bottle-glass::before{ content:""; position:absolute; left:50%; top:-22px; transform:translateX(-50%); width:24px; height:26px; background:inherit; border-radius:3px; border:2px solid rgba(255,255,255,0.15); border-bottom:none;}
  .bottle-glass.elli{ background: linear-gradient(180deg,#3a5a28,#22380f);}
  .bottle-glass.falkorc{ background: linear-gradient(180deg,#5a2a20,#2e120c);}
  .bottle-label{ position:absolute; left:8%; right:8%; top:38%; background:#f1e2c2; color:#241708; border-radius:2px; padding:6px 4px; font-size:8.5px; line-height:1.3; box-shadow:0 2px 6px rgba(0,0,0,0.4); font-style:italic;}
  .bottle-name{ font-size:12px; color:var(--accent); margin-top:10px; font-variant:small-caps; letter-spacing:1px;}
  .bottle-stamp{ position:absolute; top:30%; left:50%; transform:translate(-50%,-50%) rotate(-18deg); border:2px solid var(--danger); color:var(--danger); font-size:11px; letter-spacing:2px; padding:3px 8px; text-transform:uppercase; opacity:0.9; border-radius:3px;}
  .bottle-note{ font-size:9px; color:var(--text-dim); margin-top:4px; text-transform:uppercase; letter-spacing:1px;}

  /* ---- cube assignment ---- */
  .cube-row{ display:flex; gap:60px; justify-content:center; margin:16px 0; align-items:center; flex-wrap:wrap;}
  .cube-slot{ text-align:center; }
  .cube-icon{ width:80px; height:80px; margin:0 auto; border-radius:8px; border:2px solid var(--line); background:#180f08; display:grid; gap:2px; padding:6px; box-shadow:0 10px 24px rgba(0,0,0,0.5);}
  .cube-icon.two{ grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  .cube-icon.three{ grid-template-columns:1fr 1fr 1fr; grid-template-rows:1fr 1fr 1fr; }
  .cube-icon i{ background: linear-gradient(135deg, var(--astral), var(--astral-dim)); border-radius:2px; display:block;}
  .cube-slot .who{ font-size:13px; color:var(--accent); margin-top:10px; font-variant:small-caps; letter-spacing:1px;}
  .cube-slot .which{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-top:2px;}
  .drawing .cube-slot .who{ animation: flicker 0.12s infinite; }
  @keyframes flicker{ 50%{ opacity:0.3; } }

  /* ---- stopwatch ---- */
  .stopwatch{ font-size:64px; letter-spacing:1px; color:var(--accent); text-shadow:0 0 22px rgba(227,184,79,0.4); font-variant-numeric: tabular-nums; margin: 6px 0;}
  .stopwatch small{ font-size:22px; color:var(--text-dim);}

  /* ---- widget game (Act II) ---- */
  .widget-label{ font-size:12px; letter-spacing:3px; color: var(--text-dim); text-transform:uppercase; font-variant: small-caps;}
  .track-wrap{ width:100%; }
  .scale-labels{ display:flex; justify-content:space-between; font-size:10px; letter-spacing:1px; color: var(--text-dim); margin-bottom:6px; text-transform:uppercase; }
  .track{
    position:relative; height: 58px; background:#0f0904; border:1px solid var(--line); border-radius: 8px; overflow:hidden; touch-action:none;
    cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSczMicgaGVpZ2h0PSc0MCcgdmlld0JveD0nMCAwIDMyIDQwJz4KPHBhdGggZD0nTTEzIDJoNnY3bDcgMTRhNSA1IDAgMCAxLTQuNSA3aC0xMUE1IDUgMCAwIDEgNiAyM2w3LTE0VjJ6JyBmaWxsPScjMjQxMTA4JyBzdHJva2U9JyNkNGFmMzcnIHN0cm9rZS13aWR0aD0nMS42JyBzdHJva2UtbGluZWpvaW49J3JvdW5kJy8+CjxwYXRoIGQ9J004LjMgMjFoMTUuNGwxLjIgMi40YTUgNSAwIDAgMS00LjUgN2gtOWE1IDUgMCAwIDEtNC41LTd6JyBmaWxsPScjNGM4ZjNmJy8+CjxjaXJjbGUgY3g9JzE2JyBjeT0nMjcnIHI9JzEuNCcgZmlsbD0nIzhmZTM3YScgb3BhY2l0eT0nMC44Jy8+CjxjaXJjbGUgY3g9JzE5LjUnIGN5PScyNC41JyByPScwLjknIGZpbGw9JyM4ZmUzN2EnIG9wYWNpdHk9JzAuNycvPgo8cmVjdCB4PScxMicgeT0nMC41JyB3aWR0aD0nOCcgaGVpZ2h0PSczJyByeD0nMScgZmlsbD0nI2Q0YWYzNycvPgo8L3N2Zz4K') 6 4, auto;
  }
  .track-fill{ position:absolute; inset:0; background: linear-gradient(90deg, #1c1108 0%, #2e1c0c 40%, #4a2f10 70%, #6b3d14 100%); opacity:0.6; }
  .track-ticks{ position:absolute; inset:0; display:flex; justify-content:space-between; padding: 0 8px; align-items:center; }
  .track-ticks i{ width:1px; height:10px; background: var(--line); opacity:0.6; }
  .critter{ position:absolute; top:50%; width:42px; height:42px; transform: translate(-50%,-50%); transition: filter 0.15s; cursor:grab; touch-action:none; z-index:2; filter: drop-shadow(0 0 8px rgba(0,0,0,0.6)); }
  .critter svg{ width:100%; height:100%; display:block; }
  .critter.locked{ filter: drop-shadow(0 0 14px rgba(227,184,79,0.8)); }
  .critter.grabbed{ cursor:grabbing; filter: drop-shadow(0 0 16px rgba(255,255,255,0.6)); transform: translate(-50%,-50%) scale(1.15); transition:none; }
  .critter.evade{ animation: evadeShake 0.22s; }
  @keyframes evadeShake{
    0%{ transform: translate(-50%,-50%) scale(1); }
    30%{ transform: translate(-70%,-65%) scale(0.85) rotate(-8deg); }
    60%{ transform: translate(-30%,-35%) scale(0.85) rotate(8deg); }
    100%{ transform: translate(-50%,-50%) scale(1); }
  }
  .widget-status{ height:16px; font-size:11px; letter-spacing:2px; text-transform:uppercase; color: var(--warn); text-align:center; opacity:0; transition: opacity 0.2s; }
  .widget-hint{ font-size:11px; color: var(--text-dim); letter-spacing:1px; text-align:center; text-transform:uppercase; margin-top:-4px; font-style:italic;}
  .readout{ font-size: 46px; letter-spacing:1px; color: var(--accent); text-shadow:0 0 20px rgba(227,184,79,0.4); font-variant-numeric: tabular-nums;}
  .readout small{ font-size:16px; color: var(--text-dim); margin-left:4px;}
  .subreadout{ font-size:10px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; margin-top:-10px;}
  .loading{ font-size:12px; letter-spacing:2px; color: var(--warn); text-transform:uppercase; min-height:20px; font-style:italic;}
  .result-card{ text-align:center; max-width: 640px; }
  .result-quote{ font-size: 21px; line-height:1.5; color: var(--text); font-style:italic; margin: 6px 0 16px; }
  .result-quote.tier0{ color: #e8dcc0; font-style:normal; font-size:26px; letter-spacing:1px; text-transform:uppercase; font-variant: small-caps;}
  .entropy-row{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom: 6px;}
  .entropy-score{ font-size:15px; color:var(--astral); letter-spacing:1px;}
  .entropy-tier{ font-size:10px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; border:1px solid var(--line-dim); padding:3px 8px; border-radius: 4px;}
  .excuse{ font-size:11px; color: var(--danger); letter-spacing:1px; margin-top:10px; text-transform:uppercase; font-style:italic;}
  .turn-summary{ text-align:center; }
  .turn-summary h2{ font-size:17px; letter-spacing:2px; color:var(--accent); margin-bottom:14px; font-variant:small-caps;}
  .turn-summary .avg{ font-size:34px; color:var(--text); margin-bottom:4px;}
  .turn-summary .avg small{ font-size:12px; color:var(--text-dim);}
  .final-card{ text-align:center; }
  .final-card h2{ font-size:22px; letter-spacing:2px; color: var(--gold); margin-bottom:4px; font-variant:small-caps;}
  .final-card .sub{ font-size:11px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; margin-bottom:24px;}
  .score-table{ display:flex; gap:40px; justify-content:center; margin-bottom:22px;}
  .score-col{ text-align:center;}
  .score-col .name{ font-size:10px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px;}
  .score-col .val{ font-size:38px; color: var(--astral);}
  .score-col.sup .val{ color: var(--text-dim); }
  .verdict{ font-size:13px; color:var(--text); letter-spacing:1px; max-width:480px; margin:0 auto; line-height:1.6;}
  .player-badge{ display:flex; align-items:center; justify-content:space-between; background: #180f08; border:1px solid var(--line-dim); border-radius:4px; padding: 10px 16px; margin-bottom: 22px; width:100%; }
  .player-badge .role{ font-size:15px; letter-spacing:1px; color:var(--text); }
  .player-badge .role b{ color: var(--accent); }
  .player-badge .meta{ font-size:10px; color:var(--text-dim); letter-spacing:1px; text-align:right; line-height:1.6;}
  .round-pips{ display:flex; gap:6px; margin-top:4px; justify-content:flex-end;}
  .round-pips span{ width:7px;height:7px;border-radius:50%; background:#3a2814; }
  .round-pips span.done{ background: var(--accent); }
  .round-pips span.current{ background: var(--warn); }

  /* ---- overlays ---- */
  .overlay{
    position:fixed; inset:0; background: radial-gradient(ellipse at 50% 50%, #2a1030 0%, rgba(5,2,4,0.96) 65%);
    display:flex; align-items:center; justify-content:center; flex-direction:column; z-index: 50; text-align:center; padding:20px;
  }
  .overlay .tag{ font-size:11px; letter-spacing:4px; color: var(--astral); margin-bottom:18px; animation: blink 1s infinite; text-transform:uppercase;}
  @keyframes blink{ 50%{ opacity:0.3; } }
  .overlay .big{ font-size: min(22vw, 150px); letter-spacing: 8px; color: var(--gold); text-shadow: 0 0 70px rgba(166,120,224,0.7), 0 0 30px rgba(240,200,90,0.6); line-height:1; font-variant: small-caps;}
  .overlay .conclusion{ font-size:13px; color:var(--text-dim); letter-spacing:1px; max-width:520px; margin-top:26px; line-height:1.7;}
  .overlay .conclusion b{ color:var(--accent); }
  .overlay .conclusion .sub2{ display:block; margin-top:10px; font-style:italic; font-size:11px; color:var(--astral-dim);}

  .idle-hint{ font-size:13px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; text-align:center; font-style:italic;}
  .idle-hint b{ color: var(--accent); font-style:normal;}

  .finale-portraits{ display:flex; gap:30px; justify-content:center; margin:18px 0;}
  .finale-portraits .portrait img{ border-color: var(--accent); box-shadow:0 0 30px rgba(227,184,79,0.35);}

  @media (max-width: 560px){
    .score-table{ gap:20px; }
    .readout{ font-size:34px; }
    .stopwatch{ font-size:44px; }
    .bottle-row{ gap:24px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="rig" id="rig">
    <div class="corner tl">❖</div><div class="corner tr">❖</div><div class="corner bl">❖</div><div class="corner br">❖</div>
    <header>
      <div class="brand">
        <h1>The Gin Defense of the Gate</h1>
        <p id="actLabel">Prologue</p>
      </div>
      <div class="status">
        <div><span class="dot"></span>The Weave Holds</div>
        <div>Sigil: Owlbear Mk.III</div>
      </div>
    </header>
    <div class="stage" id="stage"></div>
    <footer class="hint">Baldur's Gin &mdash; brewed beneath the Gate &mdash; use arrow keys to navigate</footer>
  </div>
</div>

  function rand(min, max){ return Math.random() * (max - min) + min; }
  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function beep(freq, dur, vol){
    try{
      const ctx = beep._ctx || (beep._ctx = new (window.AudioContext || window.webkitAudioContext)());
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.value = vol || 0.04;
      o.connect(g); g.connect(ctx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (dur||0.12));
      o.stop(ctx.currentTime + (dur||0.12) + 0.02);
    }catch(e){}
  }

  const stage = document.getElementById('stage');
  const actLabel = document.getElementById('actLabel');
  const rig = document.getElementById('rig');

  // ================= scene machine =================
  const SCENE_ORDER = ['title','threat','defenders','trials_preview','act1_brief','act1_finalists',
    'act2_brief','act2_game','act2_bottles','act3_brief','act3_assign','act3_duel','finale'];
  const ACT_LABELS = {
    title:'Prologue', threat:'Prologue', defenders:'Prologue', trials_preview:'Prologue',
    act1_brief:'Trial I — The Protocol Trials', act1_finalists:'Trial I — The Protocol Trials',
    act2_brief:'Trial II — The Flavor Duel', act2_game:'Trial II — The Flavor Duel', act2_bottles:'Trial II — The Flavor Duel',
    act3_brief:'Trial III — The Puzzle of Tastes', act3_assign:'Trial III — The Puzzle of Tastes', act3_duel:'Trial III — The Puzzle of Tastes',
    finale:'Epilogue'
  };
  let sceneIndex = 0;

  function renderScene(id){
    actLabel.textContent = ACT_LABELS[id] || '';
    rig.scrollTop = 0;
    const fn = RENDERERS[id];
    if(fn) fn();
  }
  function goTo(id){
    const i = SCENE_ORDER.indexOf(id);
    if(i >= 0){ sceneIndex = i; renderScene(id); }
  }
  function next(){ if(sceneIndex < SCENE_ORDER.length-1){ sceneIndex++; renderScene(SCENE_ORDER[sceneIndex]); } }
  function prev(){ if(sceneIndex > 0){ sceneIndex--; renderScene(SCENE_ORDER[sceneIndex]); } }

  // ================= generic story slide renderer =================
  function storySlide({eyebrow, heading, portraits, body, list, buttonLabel, onButton}){
    let html = `<div class="scene-story">`;
    if(eyebrow) html += `<div class="story-eyebrow">${eyebrow}</div>`;
    html += `<h2>${heading}</h2>`;
    if(portraits && portraits.length){
      html += `<div class="portrait-row">`;
      portraits.forEach(p => {
        html += `<div class="portrait"><img src="${IMG[p.img]}" alt="${p.name}"><div class="pname">${p.name}</div><div class="ptitle">${p.title}</div></div>`;
      });
      html += `</div>`;
    }
    if(body) html += `<div class="story-body">${body}</div>`;
    if(list && list.length){
      html += `<ul class="trial-list">`;
      list.forEach(li => { html += `<li>${li}</li>`; });
      html += `</ul>`;
    }
    html += `<div class="actions"><button id="storyNextBtn">${buttonLabel || 'Continue'}</button></div></div>`;
    stage.innerHTML = html;
    document.getElementById('storyNextBtn').addEventListener('click', onButton || next);
  }

  // ================= RENDERERS =================
  const RENDERERS = {};

  RENDERERS.title = function(){
    stage.innerHTML = `
      <div class="scene-story">
        <div class="story-eyebrow">An Alternative Trial, in Three Acts</div>
        <h2 style="font-size:30px;">The Gin Defense of the Gate</h2>
        <div class="story-body">For years, one still has ruled the taverns of the Gate. Tonight, that reign is challenged.</div>

      heading: 'A Shadow Falls Over the Gate',
      portraits: [{img:'falk', name:'Falkorc', title:'Lord of the Midnight Bar'}],

  RENDERERS.act1_finalists = function(){
    stage.innerHTML = `
      <div class="scene-story">

        <h2>Name the Finalists</h2>

    const rosterEl = document.getElementById('rosterEl');
    function drawRoster(){
      rosterEl.innerHTML = '';
      roster.forEach((r, idx) => {

        card.addEventListener('click', (e) => {
          if(e.target.tagName === 'INPUT') return;
          const selectedCount = roster.filter(x=>x.selected).length;
          if(!r.selected && selectedCount >= 2) return;
          r.selected = !r.selected;
          drawRoster();
        });
        const input = card.querySelector('input');
        input.addEventListener('click', e => e.stopPropagation());
        input.addEventListener('input', e => { roster[idx].name = e.target.value; });
        rosterEl.appendChild(card);
      });
      const count = roster.filter(x=>x.selected).length;
      document.getElementById('confirmFinalists').disabled = count !== 2;
    }
    drawRoster();
    document.getElementById('confirmFinalists').addEventListener('click', () => {
      beep(600,0.1,0.04);
      next();
    });
  };

  RENDERERS.act2_brief = function(){

  // ================= ACT II: flavor duel (chase-the-owlbear) =================
  const TIER0 = ["Lime","Lemon","Honey","Juniper","Pepper","Herbs","Citrus","Mint","Orange","Rosemary","Coriander","Grapefruit"];
  const TIER1 = ["Fresh lime peel","Herbal juniper","Spiced citrus","Floral honey","Dry rosemary","Bitter grapefruit","Resinous pine","Warm coriander","Soft citrus","Peppery herbs"];
  const TIER2 = ["Coastal bergamot with resinous juniper","Alpine herbs with a mineral citrus finish","Sun-warmed rosemary and bitter grapefruit","Floral honey with dry botanical tension","Mediterranean citrus with subtle pine resin","Wild herbs over a cool limestone finish"];
  const TIER3 = [
    "Rain-soaked bergamot with nostalgic alpine resin","Forbidden citrus memories with a velvet cathedral finish",
    "Moonlit juniper contemplating its mortality beneath a Sicilian thunderstorm","Post-rain rosemary with emotionally distant grapefruit",
    "Hand-foraged Mediterranean melancholy with a mineral finish","A distant bicycle bell wrapped in Tuscan citrus",
    "Pine forest nostalgia with unresolved coriander tension","Damp cathedral stone with a whisper of forbidden lemon",
    "Wild juniper filtered through an emotionally unavailable sunset","An introspective grapefruit moving through coastal fog",

  const EXCUSES = [

    "Tadpole insufficiently invasive.","Too much order, not enough chaos.","Saving throw succeeded (unfortunately).",
    "The dice remain unmoved.","Inspiration point wasted.","Counterspell interference detected.","Concentration check failed to matter."
  ];
  const LOADING = [
    "Consulting the Weave...","Rolling for wild magic surge...","Attuning to the Astral Plane...","Channeling tadpole whispers...",
    "Scrying botanical entrails...","Rolling percentile dice...","Checking for critical failure...","Invoking a minor blessing...",
    "Measuring chaos affinity...","Bartering with a displaced spirit..."
  ];
  const LOADING_EXP = [
    "Consulting the Weave...","Destabilizing the astral tether...","Increasing wild magic surge...","Removing common sense...",
    "Channeling forgotten tadpole memories...","Generating legendary tasting language..."
  ];
  const PROFILES = {
    elli:    { label: "Elli, the Tadpole-Touched", trait: "Wild magic surge: +28% · Chaos affinity: HIGH", bias: 25, noise: [-5, 20] },
    falkorc: { label: "Falkorc the Unyielding",     trait: "Lawful wards: +74% · Chaos resistance: HIGH", bias: -25, noise: [-25, 8] }
  };
  const MAX_ROUNDS = 3;
  const CRITTER_SVG = `<svg viewBox="0 0 48 48">
    <ellipse cx="24" cy="28" rx="17" ry="15" fill="#8a5a34"/>
    <ellipse cx="24" cy="33" rx="10" ry="8" fill="#c99a63"/>
    <path d="M10 14 L16 22 L8 24 Z" fill="#6b4223"/>
    <path d="M38 14 L32 22 L40 24 Z" fill="#6b4223"/>
    <circle cx="17" cy="24" r="6" fill="#fff9ec"/>
    <circle cx="31" cy="24" r="6" fill="#fff9ec"/>
    <circle cx="18" cy="25" r="3" fill="#241108"/>
    <circle cx="30" cy="25" r="3" fill="#241108"/>
    <path d="M21 30 L27 30 L24 35 Z" fill="#e0a458"/>
  </svg>`;

  let g = null; // act2 state, (re)initialized by initAct2

  RENDERERS.act2_game = function(){ initAct2(); };

  function initAct2(){
    g = {
      mode: null, phase: 'idle', round: 1, locked: null,
      pendingForce: null, animId: null,
      turns: { elli: [], falkorc: [] },
      finishedTurn: { elli: false, falkorc: false },
      experimentalOffered: { falkorc: false },
      _pmHandler: null, _puHandler: null, idleJitterTimer: null
    };
    setMode2('elli');
  }

  function tierFromScore(s){
    if(s >= 76) return {n:3, pool: TIER3};
    if(s >= 51) return {n:2, pool: TIER2};
    if(s >= 26) return {n:1, pool: TIER1};
    return {n:0, pool: TIER0};
  }
  function scoreLabel(s){
    if(s >= 96) return "Artifact";
    if(s >= 81) return "Legendary";
    if(s >= 61) return "Very Rare";
    if(s >= 41) return "Rare";
    if(s >= 21) return "Uncommon";
    return "Common";
  }
  function sabotageChance(v){
    if(v > 90) return 0.70;
    if(v > 75) return 0.45;
    if(v > 55) return 0.22;
    return 0;
  }

  function renderBadge2(){
    if(!g.mode) return '';
    const p = PROFILES[g.mode];
    let pips = '';
    for(let i=1;i<=MAX_ROUNDS;i++){
      let cls = '';
      if(i < g.round) cls = 'done'; else if(i === g.round && g.phase !== 'turn-summary') cls = 'current';
      pips += `<span class="${cls}"></span>`;
    }
    return `<div class="player-badge"><div class="role">CHALLENGER: <b>${p.label}</b></div><div class="meta"><div>${p.trait}</div><div class="round-pips">${pips}</div></div></div>`;
  }

  function stopAnim2(){ if(g.animId) cancelAnimationFrame(g.animId); g.animId = null; }
  function cleanupWidgetListeners2(){
    if(g._pmHandler){ document.removeEventListener('pointermove', g._pmHandler); g._pmHandler = null; }
    if(g._puHandler){ window.removeEventListener('pointerup', g._puHandler); window.removeEventListener('pointercancel', g._puHandler); g._puHandler = null; }
    if(g.idleJitterTimer){ clearTimeout(g.idleJitterTimer); g.idleJitterTimer = null; }
  }

  function renderInteractiveWidget(extended){
    stopAnim2();
    cleanupWidgetListeners2();
    const scaleLabels = extended
      ? '<span>Mundane</span><span>Legendary</span><span>Astral</span><span style="color:var(--danger);">Beyond the Weave</span>'
      : '<span>Mundane</span><span>Enchanted</span><span>Legendary</span><span>Astral</span>';
    stage.innerHTML = `
      ${renderBadge2()}
      <div class="widget-label" ${extended ? 'style="color:var(--astral);"' : ''}>${extended ? 'The Weave Tears Open' : 'Arcane Sensitivity'}</div>
      <div class="track-wrap">
        <div class="scale-labels">${scaleLabels}</div>
        <div class="track" id="track">
          <div class="track-fill"></div>
          <div class="track-ticks">${'<i></i>'.repeat(9)}</div>
          <div class="critter" id="critter" style="left:12%;">${CRITTER_SVG}</div>
        </div>
      </div>
      <div class="readout" id="readout">--<small>%</small></div>
      <div class="widget-status" id="widgetStatus"></div>
      <div class="widget-hint">${extended ? 'wrestle the owlbear as far right as it will allow' : 'catch the owlbear and drag it to attune the brew'}</div>
    `;

    const track = document.getElementById('track');
    const critter = document.getElementById('critter');
    const readout = document.getElementById('readout');
    const statusEl = document.getElementById('widgetStatus');
    const mode = g.mode;
    const cfg = mode === 'falkorc'
      ? { catchPx: 14, evadePx: 85, idleJitter: true, jitterEvery: [900, 1500], jitterAmt: [6, 14],
          gravityPerFrame: -0.055, followLagRight: 0.42, followLagLeft: 0.88, dragNoise: 2.0, evadeCooldown: 240 }
      : { catchPx: 46, evadePx: 55, idleJitter: false,
          gravityPerFrame: 0.05, followLagRight: 0.92, followLagLeft: 0.55, dragNoise: 0.4, evadeCooldown: 500 };

    let handlePos = rand(8, 18);
    let dragging = false;
    let lastEvadeTs = 0;
    let evadePxCurrent = cfg.evadePx;
    let statusTimer = null;
    let mouseX = null;

    function trackRect(){ return track.getBoundingClientRect(); }
    function posToPercent(clientX){ const r = trackRect(); return clamp(((clientX - r.left) / r.width) * 100, 2, 98); }
    function percentToPx(pct){ const r = trackRect(); return r.left + (pct / 100) * r.width; }
    function setHandle(pct){
      handlePos = clamp(pct, 2, 98);
      critter.style.left = handlePos + '%';
      const displayVal = extended ? Math.round((handlePos / 98) * 120) : Math.round(handlePos);
      readout.innerHTML = displayVal + '<small>%</small>';
    }
    setHandle(handlePos);
    function flashStatus(msg, ms){
      statusEl.textContent = msg; statusEl.style.opacity = 1;
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { statusEl.style.opacity = 0; }, ms || 650);
    }
    function tryEvade(clientX){
      const now = performance.now();
      if(now - lastEvadeTs < cfg.evadeCooldown) return;
      const dist = Math.abs(clientX - percentToPx(handlePos));
      if(dist < evadePxCurrent && dist > cfg.catchPx){
        lastEvadeTs = now;
        evadePxCurrent = Math.max(cfg.catchPx + 10, evadePxCurrent * 0.85);
        critter.classList.remove('evade'); void critter.offsetWidth; critter.classList.add('evade');
        let newPos;
        if(mode === 'elli' && Math.random() < 0.45){
          newPos = handlePos + rand(10, 25);
        } else {
          const dir = clientX < percentToPx(handlePos) ? 1 : -1;
          newPos = handlePos + dir * rand(14, 32);
        }
        setHandle(newPos);
        flashStatus(pick(['THE OWLBEAR FLEES','WILD MAGIC FLICKERS','THE WEAVE SHUDDERS','CHAOS STIRS']), 550);
        beep(300, 0.06, 0.03);
      }
    }
    function onPointerMove(e){ mouseX = e.clientX; }
    g._pmHandler = onPointerMove;
    document.addEventListener('pointermove', onPointerMove);
    function onPointerDown(e){
      if(g.phase !== 'idle-lock' && g.phase !== 'experimental-lock') return;
      const dist = Math.abs(e.clientX - percentToPx(handlePos));
      if(dist <= cfg.catchPx){
        dragging = true; critter.classList.add('grabbed');
        flashStatus('THE OWLBEAR IS CAUGHT', 500); beep(500, 0.05, 0.03);
      } else { tryEvade(e.clientX); }
    }
    track.addEventListener('pointerdown', onPointerDown);
    function onPointerUp(){
      if(!dragging) return;
      dragging = false; critter.classList.remove('grabbed');
      settleSpring();
    }
    g._puHandler = onPointerUp;
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
    if(cfg.idleJitter){
      const scheduleJitter = () => {
        const delay = rand(cfg.jitterEvery[0], cfg.jitterEvery[1]);
        g.idleJitterTimer = setTimeout(() => {
          if(!dragging){
            const amt = rand(cfg.jitterAmt[0], cfg.jitterAmt[1]) * (Math.random() < 0.5 ? -1 : 1);
            setHandle(handlePos + amt);
            flashStatus('CHAOS STIRS', 500);
          }
          scheduleJitter();
        }, delay);
      };
      scheduleJitter();
    }
    function frame(){
      if(!dragging){
        setHandle(handlePos + cfg.gravityPerFrame);
        if(mouseX !== null) tryEvade(mouseX);
      } else if(mouseX !== null){
        const targetPct = posToPercent(mouseX);
        const delta = targetPct - handlePos;
        const lag = delta >= 0 ? cfg.followLagRight : cfg.followLagLeft;
        setHandle(handlePos + delta * lag + rand(-cfg.dragNoise, cfg.dragNoise));
      }
      g.animId = requestAnimationFrame(frame);
    }
    g.animId = requestAnimationFrame(frame);

    function settleSpring(){
      stopAnim2(); cleanupWidgetListeners2();
      g.phase = extended ? 'experimental-settling' : 'settling';
      flashStatus('THE WEAVE STABILIZES...', 900);
      const startVal = handlePos;
      let finalVal, bounces;
      if(mode === 'elli'){
        finalVal = clamp(startVal + rand(-2, 12), 2, 98);
        bounces = [clamp(startVal + rand(-3,3),2,98), finalVal];
      } else {
        finalVal = clamp(startVal + rand(-25, 10), 2, 98);
        bounces = [clamp(startVal + rand(8,20) * (Math.random() < 0.5 ? 1 : -1), 2, 98), clamp(finalVal + rand(-12,12), 2, 98), finalVal];
      }
      let i = 0;
      function step(){
        setHandle(bounces[i]); i++;
        if(i < bounces.length){ setTimeout(step, 170); } else finishLock();
      }
      setTimeout(step, 120);
    }
    function finishLock(){
      const finalPct = extended ? Math.round((handlePos / 98) * 120) : Math.round(handlePos);
      g.locked = clamp(finalPct, 0, extended ? 120 : 100);
      beep(880, 0.08, 0.05);
      if(extended){ triggerGinReveal(); } else { g.phase = 'locked'; renderLocked(); }
    }
  }

  function renderLocked(){
    stage.innerHTML = `
      ${renderBadge2()}
      <div class="widget-label">Arcane Sensitivity</div>
      <div class="track-wrap">
        <div class="scale-labels"><span>Mundane</span><span>Enchanted</span><span>Legendary</span><span>Astral</span></div>
        <div class="track" id="track">
          <div class="track-fill"></div><div class="track-ticks">${'<i></i>'.repeat(9)}</div>
          <div class="critter locked" style="left:${g.locked}%;">${CRITTER_SVG}</div>
        </div>
      </div>
      <div class="readout">${g.locked}<small>%</small></div>
      <div class="subreadout">attunement accepted</div>
      <button id="analyzeBtn">Consult the Weave</button>
    `;
    document.getElementById('analyzeBtn').addEventListener('click', runAnalysis);
  }

  function runAnalysis(){
    g.phase = 'analyzing';
    stage.innerHTML = `${renderBadge2()}<div class="widget-label">Divining</div><div class="readout">${g.locked}<small>%</small></div><div class="loading" id="loadingText"></div>`;
    const loadingText = document.getElementById('loadingText');
    let i = 0;
    const msgs = LOADING.slice().sort(()=>Math.random()-0.5).slice(0,3);
    loadingText.textContent = msgs[0];
    const iv = setInterval(() => { i++; if(i < msgs.length) loadingText.textContent = msgs[i]; }, 260);
    setTimeout(() => { clearInterval(iv); computeAndShowResult(); }, 800);
  }

  function computeAndShowResult(){
    const mode = g.mode;
    const profile = PROFILES[mode];
    let visible = g.locked, sabotaged = false, excuse = null, entropy;
    if(g.pendingForce === 'absurd'){
      entropy = Math.round(rand(88, 100));
    } else if(g.pendingForce === 'boring'){
      entropy = Math.round(rand(2, 18));
      sabotaged = mode === 'falkorc' && visible > 60;
    } else {
      const noise = rand(profile.noise[0], profile.noise[1]);
      entropy = clamp(Math.round(visible + profile.bias + noise), 0, 100);
      if(mode === 'falkorc'){
        const chance = sabotageChance(visible);
        if(chance > 0 && Math.random() < chance){ entropy = Math.round(rand(4, 20)); sabotaged = true; }
      }
    }
    g.pendingForce = null;
    let resultText;
    if(sabotaged){ resultText = pick(SABOTAGE_RESULTS); excuse = pick(EXCUSES); }
    else { resultText = pick(tierFromScore(entropy).pool); }
    g.turns[mode].push({ visible, entropy, resultText, sabotaged });
    beep(sabotaged ? 220 : 660, 0.18, 0.05);
    renderResult(resultText, entropy, sabotaged, excuse);
  }

  function renderResult(resultText, entropy, sabotaged, excuse){
    g.phase = 'result';
    const tier = tierFromScore(entropy);
    const isTier0 = tier.n === 0;
    const isLastRound = g.round >= MAX_ROUNDS;
    const offerExperimental = g.mode === 'falkorc' && isLastRound && !g.experimentalOffered.falkorc;
    stage.innerHTML = `
      ${renderBadge2()}
      <div class="result-card">
        <div class="widget-label">The Weave Reveals</div>
        <div class="result-quote ${isTier0 ? 'tier0' : ''}">${isTier0 ? resultText : '“' + resultText + '.”'}</div>
        <div class="entropy-row"><div class="entropy-score">WILD MAGIC SURGE: ${entropy}</div><div class="entropy-tier">${scoreLabel(entropy)}</div></div>
        ${sabotaged ? `<div class="excuse">${excuse}</div>` : ''}
        <div class="actions">
          ${isLastRound
            ? (offerExperimental ? `<button id="expBtn" class="gold">Defy the Weave</button><button id="finishBtn" class="secondary">Yield the Flask</button>`
                                  : `<button id="finishBtn">Yield the Flask</button>`)
            : `<button id="nextBtn">Attune Again</button>`}
        </div>
      </div>`;
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.addEventListener('click', () => { g.round += 1; g.locked = null; g.phase = 'idle-lock'; renderInteractiveWidget(false); });
    const finishBtn = document.getElementById('finishBtn');
    if(finishBtn) finishBtn.addEventListener('click', showTurnSummary);
    const expBtn = document.getElementById('expBtn');
    if(expBtn) expBtn.addEventListener('click', () => { g.experimentalOffered.falkorc = true; g.phase = 'experimental-lock'; renderInteractiveWidget(true); });
  }

  function showTurnSummary(){
    g.finishedTurn[g.mode] = true;
    g.phase = 'turn-summary';
    const runs = g.turns[g.mode];
    const avg = Math.round(runs.reduce((a,r)=>a+r.entropy,0) / runs.length);
    const best = Math.max(...runs.map(r=>r.entropy));
    const bothDone = g.finishedTurn.elli && g.finishedTurn.falkorc;
    stage.innerHTML = `
      <div class="turn-summary">
        <h2>Attunement Complete — ${PROFILES[g.mode].label}</h2>
        <div class="avg">${avg}<small> avg surge</small></div>
        <div class="subreadout" style="margin-top:6px;">best: ${best}</div>
        <div class="actions">
          ${bothDone ? `<button id="finalBtn" class="gold">The Duel is Decided</button>`
                     : `<button id="switchBtn">Summon ${g.mode === 'elli' ? 'Falkorc' : 'Elli'}</button>`}
        </div>
      </div>`;
    const finalBtn = document.getElementById('finalBtn');
    if(finalBtn) finalBtn.addEventListener('click', showFinal2);
    const switchBtn = document.getElementById('switchBtn');
    if(switchBtn) switchBtn.addEventListener('click', () => setMode2(g.mode === 'elli' ? 'falkorc' : 'elli'));
  }

  function showFinal2(){
    g.phase = 'final';
    const favg = Math.round(g.turns.elli.reduce((a,r)=>a+r.entropy,0) / g.turns.elli.length);
    const savg = Math.round(g.turns.falkorc.reduce((a,r)=>a+r.entropy,0) / g.turns.falkorc.length);

      <div class="final-card">
        <h2>The Duel is Decided</h2>
        <div class="sub">Final Wild Magic Assessment</div>

          <div class="score-col sup"><div class="name">Falkorc</div><div class="val">${savg}</div></div>
        </div>

        <div class="actions" style="margin-top:20px;"><button id="toBottles" class="gold">Bottle the Winning Gins</button></div>
      </div>`;
    document.getElementById('toBottles').addEventListener('click', () => goTo('act2_bottles'));
  }

  function triggerGinReveal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="tag">Wild Magic Surge: Critical</div><div class="big" id="expBig"></div><div class="conclusion" id="expConclusion" style="display:none;">
      <b>THE WEAVE HAS SPOKEN</b><br>Even at the edge of the Astral Plane, Falkorc's brew refuses to transcend the ordinary.<span class="sub2">(some things cannot be forced.)</span>
    </div>`;
    document.body.appendChild(overlay);
    const bigEl = document.getElementById('expBig');
    const msgs = LOADING_EXP;
    let i = 0;
    bigEl.style.fontSize = '13px'; bigEl.style.letterSpacing = '2px'; bigEl.style.color = 'var(--text-dim)';
    bigEl.textContent = msgs[0];
    const iv = setInterval(() => { i++; if(i < msgs.length){ bigEl.textContent = msgs[i]; } }, 320);
    beep(150, 0.3, 0.06);
    setTimeout(() => {
      clearInterval(iv);
      bigEl.style.fontSize = ''; bigEl.style.letterSpacing = ''; bigEl.style.color = '';
      bigEl.textContent = 'GIN';
      document.getElementById('expConclusion').style.display = 'block';
      beep(880, 0.4, 0.07);
      overlay.addEventListener('click', () => { overlay.remove(); showTurnSummary(); });
      const hint = document.createElement('div');
      hint.className = 'idle-hint'; hint.style.marginTop = '24px'; hint.textContent = '(click to continue)';
      overlay.appendChild(hint);
    }, msgs.length * 320 + 200);
  }

  function forceGinOverlay(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="tag">Wild Magic Surge: Critical</div><div class="big">GIN</div><div class="conclusion"><b>THE WEAVE HAS SPOKEN</b><br>Some things cannot be forced.</div><div class="idle-hint" style="margin-top:24px;">(click to dismiss)</div>`;
    document.body.appendChild(overlay);
    beep(880, 0.4, 0.07);
    overlay.addEventListener('click', () => overlay.remove());
  }

  function setMode2(mode){
    g.mode = mode; g.round = 1; g.locked = null; g.pendingForce = null; g.phase = 'idle-lock';
    renderInteractiveWidget(false);
  }

  // ================= ACT II bottles =================
  RENDERERS.act2_bottles = function(){
    const fallback = { entropy: 0, resultText: 'an unrecorded pour' };
    const bestOf = (m) => {
      const r = g && g.turns[m];
      if(!r || !r.length) return fallback;
      return r.reduce((a,b)=> b.entropy > a.entropy ? b : a, r[0]);
    };
    const elliBest = bestOf('elli');
    const falkBest = bestOf('falkorc');
    stage.innerHTML = `
      <div class="scene-story">
        <div class="story-eyebrow">Trial II — Complete</div>
        <h2>Bottled for the Gate</h2>
        <div class="story-body">By morning, both gins stood on the shelves of the Gate. Only one would sell out by nightfall.</div>
        <div class="bottle-row">
          <div class="bottle">
            <div class="bottle-glass elli"><div class="bottle-label">“${elliBest.resultText}”</div></div>
            <div class="bottle-name">Elli's Reserve</div>
            <div class="bottle-note">Surge ${elliBest.entropy} · ${scoreLabel(elliBest.entropy)}</div>
          </div>
          <div class="bottle">
            <div class="bottle-glass falkorc"><div class="bottle-label">“${falkBest.resultText}”</div><div class="bottle-stamp">Unsold</div></div>
            <div class="bottle-name">Falkorc's Batch</div>
            <div class="bottle-note">Surge ${falkBest.entropy} · ${scoreLabel(falkBest.entropy)}</div>
          </div>
        </div>
        <div class="actions"><button id="toAct3" class="gold">Onward to the Final Trial</button></div>
      </div>`;
    document.getElementById('toAct3').addEventListener('click', next);
  };

  RENDERERS.act3_brief = function(){
    storySlide({
      eyebrow: 'Trial III',
      heading: 'The Puzzle of Tastes',
      body: `A gin that cannot be sold is no gin at all. In the Gate, closing a sale is its own puzzle &mdash; matching what the drinker wants to what sits behind the bar. Tonight, that puzzle takes shape: two cubes, their faces bearing not colors but the sigils of science itself. Match the sigils. Solve the trade.
      <br><br><i>Physical cubes will now be distributed.</i>`,
      buttonLabel: 'Assign the Cubes'
    });
  };

  RENDERERS.act3_assign = function(){
    stage.innerHTML = `
      <div class="scene-story">
        <div class="story-eyebrow">The Lots Are Drawn</div>
        <h2>Who Draws Which Stone?</h2>
        <div class="cube-row" id="cubeRow">
          <div class="cube-slot"><div class="cube-icon two">${'<i></i>'.repeat(4)}</div><div class="who" id="who1">?</div><div class="which">2×2 Stone</div></div>
          <div class="cube-slot"><div class="cube-icon three">${'<i></i>'.repeat(9)}</div><div class="who" id="who2">?</div><div class="which">3×3 Stone</div></div>
        </div>
        <div class="actions"><button id="drawBtn">Draw Lots</button></div>
      </div>`;
    const cubeRow = document.getElementById('cubeRow');
    const who1 = document.getElementById('who1');
    const who2 = document.getElementById('who2');
    document.getElementById('drawBtn').addEventListener('click', function(){
      this.disabled = true;
      cubeRow.classList.add('drawing');
      let ticks = 0;
      const iv = setInterval(() => {
        who1.textContent = pick(['Elli','Falkorc']);
        who2.textContent = who1.textContent === 'Elli' ? 'Falkorc' : 'Elli';
        ticks++;
        beep(400 + ticks*10, 0.04, 0.02);
        if(ticks > 16){
          clearInterval(iv);
          cubeRow.classList.remove('drawing');
          who1.textContent = 'Elli';
          who2.textContent = 'Falkorc';
          beep(880, 0.2, 0.05);
          const actions = document.querySelector('.scene-story .actions');
          actions.innerHTML = `<button id="beginPuzzle" class="gold">Begin the Puzzle</button>`;
          document.getElementById('beginPuzzle').addEventListener('click', next);
        }
      }, 90);
    });
  };

  RENDERERS.act3_duel = function(){
    let elapsed = 0, running = false, tickId = null, startTs = 0;
    stage.innerHTML = `
      <div class="scene-story">
        <div class="story-eyebrow">Trial III — In Progress</div>
        <h2>The Puzzle of Tastes</h2>
        <div class="stopwatch" id="clock">00:00<small>.0</small></div>
        <div class="actions">
          <button id="startBtn">Start</button>
          <button id="pauseBtn" class="secondary">Pause</button>
          <button id="resetBtn" class="secondary">Reset</button>
        </div>
        <div class="story-body" style="margin-top:22px;">Declare the winner once a stone's sigils are matched on every face:</div>
        <div class="actions">
          <button id="winElli" class="gold">Elli Solves First</button>
          <button id="winFalk" class="gold">Falkorc Solves First</button>
        </div>
      </div>`;
    const clock = document.getElementById('clock');
    function draw(){
      const s = Math.floor(elapsed/1000), ms = Math.floor((elapsed%1000)/100);
      const mm = String(Math.floor(s/60)).padStart(2,'0'), ss = String(s%60).padStart(2,'0');
      clock.innerHTML = `${mm}:${ss}<small>.${ms}</small>`;
    }
    function tick(){ elapsed = Date.now() - startTs; draw(); tickId = requestAnimationFrame(tick); }
    document.getElementById('startBtn').addEventListener('click', () => {
      if(running) return; running = true; startTs = Date.now() - elapsed; tick();
    });
    document.getElementById('pauseBtn').addEventListener('click', () => {
      running = false; if(tickId) cancelAnimationFrame(tickId);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      running = false; if(tickId) cancelAnimationFrame(tickId); elapsed = 0; draw();
    });
    document.getElementById('winElli').addEventListener('click', () => { running=false; if(tickId) cancelAnimationFrame(tickId); goTo('finale'); RENDERERS.finale('elli'); });
    document.getElementById('winFalk').addEventListener('click', () => { running=false; if(tickId) cancelAnimationFrame(tickId); goTo('finale'); RENDERERS.finale('falkorc'); });
  };

  RENDERERS.finale = function(winner){
    winner = winner || 'elli';
    const elliWins = winner === 'elli';
    const heading = elliWins ? 'Defense Successful' : 'The Gate Has a New Round of Drinks';
    const body = elliWins
      ? `The old still endures. Falkorc, axe lowered, raises a glass in respect &mdash; the gin culture of the Gate is safe for another generation.`
      : `Falkorc's stone falls into place first, and the midnight bar roars its approval. Yet even Falkorc admits: no cocktail in the Gate is stranger, or truer, than Elli's own gin.`;
    stage.innerHTML = `
      <div class="scene-story">
        <div class="story-eyebrow">Epilogue</div>
        <h2>${heading}</h2>
        <div class="finale-portraits">
          <div class="portrait"><img src="${IMG.jonas}"><div class="pname">Elli</div></div>
          <div class="portrait"><img src="${IMG.ingo}"><div class="pname">Druidingo</div></div>
          <div class="portrait"><img src="${IMG.falk}"><div class="pname">Falkorc</div></div>
        </div>
        <div class="story-body">${body}</div>
        <div class="story-body" style="color:var(--accent); margin-top:14px;"><b>In every world that matters: Jonas Maas has successfully defended his thesis.</b></div>
        <div class="idle-hint" style="margin-top:22px;">— The End —</div>
      </div>`;
  };

  // ================= presenter controls =================
  window.addEventListener('keydown', (e) => {
    if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if(e.repeat) return;
    const scene = SCENE_ORDER[sceneIndex];
    if(e.key === 'ArrowRight' || e.key === 'PageDown'){ next(); return; }
    if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ prev(); return; }
    if(e.key === 'Home'){ goTo('title'); return; }
    if(scene === 'act2_game'){
      switch(e.key){
        case '1': setMode2('elli'); break;
        case '2': setMode2('falkorc'); break;
        case '3': if(g) g.pendingForce = 'absurd'; break;
        case '4': if(g) g.pendingForce = 'boring'; break;
        case '5': forceGinOverlay(); break;
      }
    }
  });

  renderScene(SCENE_ORDER[sceneIndex]);
})();
</script>
</body>
</html>
